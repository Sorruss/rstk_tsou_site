<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Content Manager</title>
</head>
<body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
        DecapCMS.init({
            config: {
                backend: {
                    name: "github",
                    repo: "sorruss/rstk_tsou_site",
                    branch: "main",
                    auth_endpoint: "https://oauth.decapcms.org/auth/github",
                    site_domain: "sorruss.github.io"
                }
            }
        })
    </script>
</body>
</html>
