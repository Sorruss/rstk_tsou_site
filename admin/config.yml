backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: Create {{collection}} “{{slug}}”
    update: Update {{collection}} “{{slug}}”
    delete: Delete {{collection}} “{{slug}}”
    uploadMedia: Upload “{{path}}”
    deleteMedia: Delete “{{path}}”
    openAuthoring: '{{message}}'

media_folder: "media/images"
public_folder: "/media/images"

locale: 'ua'

issue_reports:
  url: https://github.com/Sorruss/rstk_tsou_site/issues/new

logo:
  src: https://avtoshkola-nv.netlify.app/media/images/logo.png
  show_in_header: true

site_url: https://avtoshkola-nv.netlify.app
display_url: https://avtoshkola-nv.netlify.app

collections:
  # === ГОЛОВНА ===
  - name: "site"
    label: "Загальні налаштування"
    files:
      - file: "content/site.json"
        label: "Сайт"
        name: "site"
        fields:
          - { label: "Назва", name: "title", widget: "string" }
          - { label: "Опис", name: "description", widget: "text" }
          - { label: "Логотип", name: "logo", widget: "image" }

  # === ПРО НАС ===
  - name: "about"
    label: "Про нас"
    files:
      - file: "content/about.json"
        label: "Про нас"
        name: "about"
        fields:
          - { label: "Заголовок", name: "title", widget: "string" }
          - { label: "Текст", name: "text", widget: "text" }
          - { label: "Фото секції", name: "image", widget: "image" }

  # === ПЕРЕВАГИ ===
  - name: "features"
    label: "Переваги"
    folder: "content/features"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Назва", name: "title", widget: "string" }
      - { label: "Опис", name: "description", widget: "text" }
      - { label: "Іконка", name: "icon", widget: "image" }

  # === ГАЛЕРЕЯ ===
  - name: "gallery"
    label: "Фото"
    folder: "content/gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Зображення", name: "image", widget: "image" }

  # === ЦІНИ ===
  - name: "prices"
    label: "Ціни"
    files:
      - file: "content/prices.json"
        label: "Ціни"
        name: "prices"
        fields:
          - label: "Теорія"
            name: "theory"
            widget: "list"
            fields:
              - { label: "Категорія", name: "category", widget: "string" }
              - { label: "Ціна", name: "price", widget: "string" }
              - { label: "Термін", name: "duration", widget: "string" }

          - label: "Практика"
            name: "practice"
            widget: "list"
            fields:
              - { label: "Категорія", name: "category", widget: "string" }
              - { label: "Ціна", name: "price", widget: "string" }
              - { label: "Термін", name: "duration", widget: "string" }

  # === КОНТАКТИ ===
  - name: "contacts"
    label: "Контакти"
    files:
      - file: "content/contacts.json"
        label: "Контакти"
        name: "contacts"
        fields:
          - { label: "Телефон", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Адреса", name: "address", widget: "string" }
          - { label: "Google Maps iframe", name: "map", widget: "text" }