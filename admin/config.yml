backend:
  name: git-gateway
  branch: main

media_folder: "media/images"
public_folder: "/media/images"

locale: "uk"

collections:

  # =========================
  # ПРО НАС
  # =========================
  - name: "about"
    label: "Про нас"
    files:
      - file: "content/about.json"
        label: "Секція 'Про нас'"
        name: "about"
        fields:
          - { label: "Заголовок", name: "title", widget: "string" }
          - { label: "Текст", name: "text", widget: "text" }
          - { label: "Зображення 'Про нас'", name: "image", widget: "image" }

  # =========================
  # ПЕРЕВАГИ
  # =========================
  - name: "features"
    label: "Переваги"
    files:
      - file: "content/features.json"
        label: "Переваги"
        name: "features"
        fields:
          - label: "Список переваг"
            name: "features"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Назва", name: "title", widget: "string" }
              - { label: "Опис", name: "description", widget: "text" }
              - { label: "Іконка", name: "icon", widget: "image" }

  # =========================
  # ГАЛЕРЕЯ
  # =========================
  - name: "gallery"
    label: "Галерея"
    files:
      - file: "content/gallery.json"
        label: "Фото"
        name: "gallery"
        fields:
          - { label: "Заголовок", name: "title", widget: "string" }
          - { label: "Фонове зображення", name: "background_image", widget: "image" }
          - label: "Карусель"
            name: "carousel"
            widget: "list"
            summary: "{{fields}}"
            field:
              label: "Назва файлу (наприклад 1.jpg)"
              name: "image"
              widget: "image"

  # =========================
  # ЦІНИ
  # =========================
  - name: "prices"
    label: "Ціни"
    files:
      - file: "content/prices.json"
        label: "Ціни"
        name: "prices"
        fields:
          - { label: "Заголовок", name: "title", widget: "string" }

          - { label: "Текст 'Теорія'", name: "theory_text", widget: "string" }
          - { label: "Текст 'Практика'", name: "practice_text", widget: "string" }

          - { label: "Категорія (заголовок)", name: "category_text", widget: "string" }
          - { label: "Ціна (заголовок)", name: "price_text", widget: "string" }
          - { label: "Термін (заголовок)", name: "duration_text", widget: "string" }

          - label: "Теорія"
            name: "theory"
            widget: "list"
            summary: "{{fields.category}} — {{fields.price}}"
            fields:
              - { label: "Категорія", name: "category", widget: "string" }
              - { label: "Ціна", name: "price", widget: "string" }
              - { label: "Термін", name: "duration", widget: "string" }

          - label: "Практика"
            name: "practice"
            widget: "list"
            summary: "{{fields.category}} — {{fields.price}}"
            fields:
              - { label: "Категорія", name: "category", widget: "string" }
              - { label: "Ціна", name: "price", widget: "string" }
              - { label: "Термін", name: "duration", widget: "string" }

  # =========================
  # КОНТАКТИ
  # =========================
  - name: "contacts"
    label: "Контакти"
    files:
      - file: "content/contacts.json"
        label: "Контакти"
        name: "contacts"
        fields:
          - { label: "Заголовок", name: "title", widget: "string" }
          - { label: "Телефон", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Адреса", name: "address", widget: "string" }

  # =========================
  # ФУТЕР
  # =========================
  - name: "footer"
    label: "Футер"
    files:
      - file: "content/footer.json"
        label: "Футер"
        name: "footer"
        fields:
          - { label: "Назва сайту", name: "title", widget: "string" }
          - { label: "Опис", name: "description", widget: "text" }

          - { label: "Заголовок 'Контакти'", name: "title_contacts", widget: "string" }
          - { label: "Заголовок 'Категорії'", name: "title_categories", widget: "string" }
          - { label: "Заголовок 'Соцмережі'", name: "title_socials", widget: "string" }

          - { label: "Телефон", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Адреса", name: "address", widget: "string" }