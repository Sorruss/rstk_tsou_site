backend:
  name: git-gateway
  branch: main

media_folder: "media"
public_folder: "/media"

locale: "uk"

collections:
  # =========================
  # ТИТУЛ
  # =========================
  - name: "title"
    label: "Титул"
    files:
      - file: "content/title.json"
        label: "Титул"
        name: "title"
        fields:
          - { label: "Зображення", name: "logo", widget: "image" }
          - { label: "Назва закладу", name: "title", widget: "string" }
          - { label: "Ліцензія", name: "license", widget: "string" }
          - { label: "Сертифікат", name: "certificate", widget: "string" }

  # =========================
  # ОГОЛОШЕННЯ
  # =========================
  - name: "announcements"
    label: "Оголошення"
    files:
      - file: "content/announcements.json"
        label: "Оголошення"
        name: "announcements"
        fields:
          - { label: "Заголовок секції", name: "title", widget: "string" }

          - label: "Оголошення"
            name: "announcements"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Мітка", name: "badge", widget: "string"}
              - { label: "Заголовок", name: "title", widget: "string" }
              - { label: "Текст", name: "text", widget: "text" }

  # =========================
  # ПРО НАС
  # =========================
  - name: "about"
    label: "Про нас"
    files:
      - file: "content/about.json"
        label: "Про нас"
        name: "about"
        fields:
          - { label: "Заголовок", name: "title", widget: "string" }
          - { label: "Текст", name: "text", widget: "text" }
          - { label: "Зображення", name: "image", widget: "image" }

      - file: "content/features.json"
        label: "Переваги"
        name: "features"
        fields:
          - label: "Список переваг"
            name: "features"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Назва", name: "title", widget: "string" }
              - { label: "Опис", name: "description", widget: "text" }
              - { label: "Іконка", name: "icon", widget: "image" }

  # =========================
  # ІНФОРМАЦІЯ
  # =========================
  - name: "prices"
    label: "Ціни"
    files:
      - file: "content/prices.json"
        label: "Ціни"
        name: "prices"
        fields:
          - { label: "Заголовок секції", name: "title", widget: "string" }

          - { label: "Текст 'Теорія'", name: "theory_text", widget: "string" }
          - { label: "Текст 'Практика'", name: "practice_text", widget: "string" }

          - { label: "Назва колонки 'Категорія'", name: "category_text", widget: "string" }
          - { label: "Назва колонки 'Ціна'", name: "price_text", widget: "string" }
          - { label: "Назва колонки 'Термін'", name: "duration_text", widget: "string" }

          - label: "Теорія"
            name: "theory"
            widget: "list"
            summary: "{{fields.category}} — {{fields.price}}"
            fields:
              - { label: "Категорія", name: "category", widget: "string" }
              - { label: "Ціна", name: "price", widget: "string" }
              - { label: "Термін", name: "duration", widget: "string" }

          - label: "Практика"
            name: "practice"
            widget: "list"
            summary: "{{fields.category}} — {{fields.price}}"
            fields:
              - { label: "Категорія", name: "category", widget: "string" }
              - { label: "Ціна", name: "price", widget: "string" }
              - { label: "Термін", name: "duration", widget: "string" }

      - file: "content/contacts.json"
        label: "Контакти"
        name: "contacts"
        fields:
          - { label: "Заголовок секції", name: "title", widget: "string" }
          - { label: "Телефон", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Адреса", name: "address", widget: "string" }

  # =========================
  # ДОКУМЕНТИ
  # =========================
  - name: "documents"
    label: "Документи"
    files:
      - file: "content/documents.json"
        label: "Документи"
        name: "documents"
        fields:
          - { label: "Заголовок секції", name: "title", widget: "string" }
          - { label: "Вступний текст", name: "text", widget: "text" }

          - label: "Список документів"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Назва", name: "title", widget: "string" }

          - { label: "Заголовок блоку поради", name: "tip_title", widget: "string" }
          - { label: "Текст поради", name: "tip_text", widget: "text" }

  # =========================
  # МЕДІА
  # =========================
  - name: "gallery"
    label: "Фото"
    files:
      - file: "content/gallery.json"
        label: "Фото"
        name: "gallery"
        fields:
          - { label: "Заголовок", name: "title", widget: "string" }

          - label: "Фото-карусель"
            name: "carousel"
            widget: "list"
            summary: "{{fields.image}}"
            fields:
              - { label: "Зображення", name: "image", widget: "image" }

      - file: "content/videos.json"
        label: "Відео"
        name: "videos"
        fields:
          - { label: "Заголовок", name: "title", widget: "string" }

          - label: "Відео-карусель"
            name: "carousel"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Відеофайл", name: "video", widget: "file" }

  # =========================
  # ПІДВАЛ
  # =========================
  - name: "footer"
    label: "Підвал"
    files:
      - file: "content/footer.json"
        label: "Підвал"
        name: "footer"
        fields:
          - { label: "Зображення", name: "logo", widget: "image" }
          - { label: "Назва сайту", name: "title", widget: "string" }
          - { label: "Опис", name: "description", widget: "text" }

          - { label: "Заголовок 'Контакти'", name: "title_contacts", widget: "string" }
          - { label: "Адреса", name: "address", widget: "string" }
          - { label: "Телефон", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }

          - { label: "Заголовок 'Категорії'", name: "title_categories", widget: "string" }
          - label: "Категорії"
            name: "categories"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Назва категорії", name: "name", widget: "string" }
              - { label: "Опис", name: "description", widget: "text" }

          - { label: "Заголовок 'Соцмережі'", name: "title_socials", widget: "string" }
          - label: "Посилання на соцмережі"
            name: "social_links"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Назва", name: "name", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - { label: "Іконка", name: "icon", widget: "file" }
          
          - { label: "Ліцензія", name: "license", widget: "string" }