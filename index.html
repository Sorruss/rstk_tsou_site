<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Базові SEO теги -->
    <title>Нововодолазька Автошкола | Навчання водіїв категорій А, А1, В</title>
    <meta name="description" content="Автошкола в Новій Водолазі. Ліцензійне навчання категоріям А, А1, В. Досвідчені інструктори, високий відсоток здачі іспитів. Запис на курси.">
    <meta name="keywords" content="автошкола Нова Водолага, навчання водіння, категорія А, категорія В, права водія">
    <meta name="author" content="Нововодолазький РСТК ТСОУ">
    
    <!-- Open Graph (для соцмереж) -->
    <meta property="og:title" content="Нововодолазька Автошкола">
    <meta property="og:description" content="Професійне навчання водіїв в Новій Водолазі">
    <meta property="og:image" content="https://avtoshkola-nv.netlify.app/media/logo.png">
    <meta property="og:url" content="https://avtoshkola-nv.netlify.app">
    
    <!-- Для пошуку по карті -->
    <meta name="geo.region" content="UA-63">
    <meta name="geo.placename" content="Нова Водолага">

    <link rel="shortcut icon" href="./media/logo.png">
    <link rel="canonical" href="https://avtoshkola-nv.netlify.app">

    <link rel="stylesheet" href="tailwind.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>

<body id="body-background" class="min-h-screen bg-slate-950 text-white">
    <main class="mx-auto w-full max-w-[1080px] px-4 sm:px-6 lg:px-8 py-6 sm:py-10">
        
        <!-- TITLE SECTION -->
        <header class="flex flex-col lg:flex-row items-center justify-center gap-6 lg:gap-10 pt-4 sm:pt-8">
            <div id="title-logo" class="shrink-0"></div>

            <div class="text-center lg:text-left space-y-2 sm:space-y-3">
                <h1 id="title-title" class="text-2xl sm:text-3xl lg:text-4xl font-bold leading-tight"></h1>
                <p id="title-license" class="text-sm sm:text-base text-white/80"></p>
                <p id="title-certificate" class="text-sm sm:text-base text-white/80"></p>
            </div>
        </header>

        <!-- ANNOUNCEMENTS SECTION -->
        <section id="announcements-section" class="mt-12 sm:mt-16 lg:mt-20">
            <div class="bg-white/10 backdrop-blur-md shadow-2xl rounded-3xl border border-white/15 overflow-hidden p-5 sm:p-6 lg:p-8">
                <div class="flex items-center justify-between gap-4 mb-6" style="margin-bottom: 16px;">
                    <h2 id="announcements-title" class="text-2xl sm:text-3xl font-semibold"></h2>
                </div>
                <div id="announcements-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
            </div>
        </section>
        
        <!-- ABOUT US SECTION -->
        <section class="mt-12 sm:mt-16">
            <div class="bg-white/10 backdrop-blur-md shadow-2xl rounded-3xl border border-white/15 overflow-hidden">
                <div class="flex flex-col lg:flex-row">
                    
                    <!-- IMAGE/CTA SECTION -->
                    <div id="about-image" class="sm:w-full lg:w-[320px] min-h-[260px] lg:min-h-[360px] 
                    background-facility flex items-end justify-center p-4 sm:p-5">
                        <button 
                            data-modal-target="auth-modal"
                            data-modal-toggle="auth-modal"
                            class="mybutton w-full sm:w-auto" type="button">
                            ЗАПИСАТИСЯ НА КУРСИ
                        </button>
                    </div>

                    <!-- ABOUT US TEXT SECTION -->
                    <div class="flex-1 p-5 sm:p-6 lg:p-8 space-y-5">
                        <div class="space-y-3">
                            <h2 id="about-title" class="text-2xl sm:text-3xl font-semibold"></h2>
                            <p id="about-text" class="text-sm sm:text-base text-white/85 leading-relaxed max-w-4xl"></p>
                        </div>

                        <!-- ABOUT US FEATURES -->
                        <div id="features-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- PRICES & MAP SECTION -->
        <section class="mt-12 sm:mt-16">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                
                <div class="bg-white/10 backdrop-blur-md rounded-3xl border border-white/15 shadow-2xl p-5 sm:p-6">
                    <h2 id="prices-title" class="text-2xl sm:text-3xl font-semibold mb-5"></h2>

                    <div class="flex flex-col space-y-5">
                        <div>
                            <h3 id="prices-theory-text" class="text-lg font-semibold mb-3 text-yellow-300"></h3>
                            <div class="overflow-hidden rounded-2xl border border-white/10">
                                <div class="grid grid-cols-3 bg-white/10 px-4 py-3 text-sm font-semibold">
                                    <div id="prices-category-text"></div>
                                    <div id="prices-price-text"></div>
                                    <div id="prices-duration-text"></div>
                                </div>
                                <div id="theory-prices" class="divide-y divide-white/10 text-sm"></div>
                            </div>
                        </div>

                        <div>
                            <h3 id="prices-practice-text" class="text-lg font-semibold mb-3 text-yellow-300">Практика</h3>
                            <div class="overflow-hidden rounded-2xl border border-white/10">
                                <div class="grid grid-cols-3 bg-white/10 px-4 py-3 text-sm font-semibold">
                                    <div id="prices-category-text"></div>
                                    <div id="prices-price-text"></div>
                                    <div id="prices-duration-text"></div>
                                </div>
                                <div id="practice-prices" class="divide-y divide-white/10 text-sm"></div>
                            </div>
                        </div>
                    
                        <button data-modal-target="auth-modal"
                            data-modal-toggle="auth-modal" class="self-center mybutton w-full sm:w-auto" type="button">
                            ЗАПИСАТИСЯ НА КУРСИ
                        </button>
                    </div>
                </div>

                <div class="bg-white/10 backdrop-blur-md rounded-3xl border border-white/15 shadow-2xl overflow-hidden">
                    <div class="p-5 sm:p-6">
                        <h2 id="contact-title" class="text-2xl sm:text-3xl font-semibold mb-4"></h2>
                    </div>
                    <div class="aspect-[4/3] sm:aspect-[16/10] lg:aspect-[4/3]">
                        <iframe
                            class="w-full h-full"
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2579.8428373082374!2d35.874501076515536!3d49.71376044013271!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x41278020e1c37d05%3A0x10647d9356d728b3!2sSerhiya%20Vasilkivskogo%20St%2C%2014%2C%20Nova%20Vodolaha%2C%20Kharkivs&#39;ka%20oblast%2C%2063200!5e0!3m2!1sen!2sua!4v1776440408712!5m2!1sen!2sua"
                            style="border:0;"
                            allowfullscreen=""
                            loading="lazy"
                            referrerpolicy="no-referrer-when-downgrade">
                        </iframe>
                    </div>
                    <div class="p-5 sm:p-6 space-y-2 text-sm sm:text-base">
                        <p><span class="font-semibold">Телефон:</span> <span id="contact-phone"></span></p>
                        <p><span class="font-semibold">Email:</span> <span id="contact-email"></span></p>
                        <p><span class="font-semibold">Адреса:</span> <span id="contact-address"></span></p>
                    </div>
                </div>

            </div>
        </section>

        <!-- DOCUMENTS SECTION -->
        <section class="mt-12 sm:mt-16">
            <div class="bg-white/10 backdrop-blur-md shadow-2xl rounded-3xl border border-white/15 overflow-hidden p-5 sm:p-6 lg:p-8">
                <h2 id="documents-title" class="text-2xl sm:text-3xl font-semibold mb-5"></h2>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
                    <div class="space-y-4 text-sm sm:text-base text-white/80 leading-relaxed">
                        <p id="documents-text"></p>
                        <ul id="documents-container" class="space-y-3"></ul>
                    </div>

                    <div class="rounded-2xl border border-white/15 bg-white/5 hover:bg-white/10 transition p-5 sm:p-6">
                        <h3 id="documents-tip_title" class="text-lg font-semibold mb-3 text-yellow-300"></h3>
                        <p id="documents-tip_text" class="text-sm sm:text-base text-white/75 leading-relaxed"></p>
                    </div>
                </div>
            </div>
        </section>

        <!-- PHOTO SECTION -->
        <section class="mt-12 sm:mt-16">
            <div class="flex items-end justify-between gap-4 mb-4">
                <h2 id="carousel-title" class="font-semibold text-white text-2xl sm:text-3xl ml-4"></h2>
            </div>

            <div id="school-carousel" class="relative w-full" data-carousel="slide">
                <div class="relative overflow-hidden rounded-3xl bg-white/10 border border-white/15 shadow-2xl aspect-[16/9]">
                    <div id="carousel-items"></div>
                </div>

                <!-- indicators -->
                <div id="carousel-indicators" class="absolute z-30 flex -translate-x-1/2 bottom-4 left-1/2 gap-2"></div>

                <!-- controls -->
                <button type="button" class="absolute top-0 start-0 z-30 flex items-center justify-center h-full px-3 sm:px-4 cursor-pointer group focus:outline-none" data-carousel-prev>
                    <span class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/20 backdrop-blur group-hover:bg-white/30 group-focus:ring-2 group-focus:ring-white/60">
                        <svg class="w-5 h-5 text-white rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m15 19-7-7 7-7"/>
                        </svg>
                        <span class="sr-only">Previous</span>
                    </span>
                </button>

                <button type="button" class="absolute top-0 end-0 z-30 flex items-center justify-center h-full px-3 sm:px-4 cursor-pointer group focus:outline-none" data-carousel-next>
                    <span class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/20 backdrop-blur group-hover:bg-white/30 group-focus:ring-2 group-focus:ring-white/60">
                        <svg class="w-5 h-5 text-white rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 5 7 7-7 7"/>
                        </svg>
                        <span class="sr-only">Next</span>
                    </span>
                </button>
            </div>
        </section>

        <!-- VIDEO SECTION -->
        <section class="mt-12 sm:mt-16">
            <div class="flex items-end justify-between gap-4 mb-4">
                <h2 id="video-carousel-title" class="font-semibold text-white text-2xl sm:text-3xl ml-4"></h2>
            </div>

            <div id="video-carousel" class="relative w-full" data-carousel="static">
                <div class="relative overflow-hidden rounded-3xl bg-white/10 border border-white/15 shadow-2xl aspect-[16/9]">
                    <div id="video-carousel-items"></div>
                </div>

                <button type="button" class="absolute top-0 start-0 z-30 flex items-center justify-center h-full px-3 sm:px-4 cursor-pointer group focus:outline-none" data-carousel-prev>
                    <span class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/20 backdrop-blur group-hover:bg-white/30 group-focus:ring-2 group-focus:ring-white/60">
                        <svg class="w-5 h-5 text-white rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m15 19-7-7 7-7"/>
                        </svg>
                        <span class="sr-only">Previous</span>
                    </span>
                </button>

                <button type="button" class="absolute top-0 end-0 z-30 flex items-center justify-center h-full px-3 sm:px-4 cursor-pointer group focus:outline-none" data-carousel-next>
                    <span class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/20 backdrop-blur group-hover:bg-white/30 group-focus:ring-2 group-focus:ring-white/60">
                        <svg class="w-5 h-5 text-white rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 5 7 7-7 7"/>
                        </svg>
                        <span class="sr-only">Next</span>
                    </span>
                </button>
            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="mt-16 relative z-50">
        <div class="bg-white/10 backdrop-blur-md border-t border-white/20">
            <div class="mx-auto max-w-[1440px] px-4 sm:px-6 lg:px-8 py-10">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">

                    <!-- LOGO / INFO -->
                    <div class="space-y-4">
                        <div class="flex items-center gap-3">
                            <img id="footer-logo" class="h-10">
                            <span id="footer-title" class="text-lg font-semibold text-white"></span>
                        </div>
                        <p id="footer-description" class="text-sm text-white/70"></p>
                    </div>

                    <!-- CONTACTS -->
                    <div>
                        <h3 id="footer-contacts" class="text-white font-semibold mb-4"></h3>
                        <ul class="space-y-2 text-sm text-white/70">
                            <li id="contact-footer-address"></li>
                            <li id="contact-footer-phone"></li>
                            <li id="contact-footer-email"></li>
                        </ul>
                    </div>

                    <!-- CATEGORIES -->
                    <div>
                        <h3 id="footer-categories" class="text-white font-semibold mb-4"></h3>
                        <ul id="footer-categories-list" class="space-y-2 text-sm text-white/70"></ul>
                    </div>

                    <!-- SOCIALS -->
                    <div>
                        <h3 id="footer-socials" class="text-white font-semibold mb-4"></h3>
                        <div id="footer-socials-list" class="flex gap-4"></div>
                    </div>

                </div>

                <!-- DIVIDER -->
                <div class="border-t border-white/20 mt-8 pt-6 flex flex-col sm:flex-row 
                justify-center items-center gap-4">

                    <p class="text-sm text-white/60 text-center sm:text-left">
                        © 2026 Нововодолазька автошкола. Всі права захищені.
                    </p>

                    <!-- <div class="flex gap-4 text-sm text-white/60">
                        <a href="#" class="hover:text-white transition">Політика конфіденційності</a>
                        <a href="#" class="hover:text-white transition">Умови</a>
                    </div> -->

                </div>
            </div>
        </div>
    </footer>

    <!-- MODAL -->
    <div id="auth-modal" tabindex="-1"
        class="hidden fixed inset-0 z-50 flex justify-center items-center bg-black/60 backdrop-blur-sm">

        <div class="relative w-full max-w-md p-4">
            
            <!-- CONTENT -->
            <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl shadow-xl text-white">
                
                <!-- HEADER -->
                <div class="flex items-center justify-between p-5 border-b border-white/20">
                    <h3 class="text-xl font-semibold">
                        Запис на курси
                    </h3>
                    <button type="button"
                        class="text-white/70 hover:text-white hover:bg-white/10 rounded-lg w-8 h-8 flex items-center justify-center"
                        data-modal-hide="auth-modal">
                        ✕
                    </button>
                </div>

                <!-- BODY -->
                <form id="contact-form" class="p-5 space-y-4">
                    
                    <div>
                        <label class="block mb-2 text-sm">Ваш email</label>
                        <input type="email" id="contact-form-email" name="email"
                            class="w-full p-2.5 rounded-lg bg-white/10 border border-white/20 text-white placeholder-white/50 focus:ring-2 focus:ring-blue-400 focus:outline-none"
                            placeholder="example@gmail.com" required>
                    </div>

                    <div>
                        <label class="block mb-2 text-sm">Ваше ім'я</label>
                        <input type="text" id="contact-form-name" name="name"
                            class="w-full p-2.5 rounded-lg bg-white/10 border border-white/20 text-white placeholder-white/50 focus:ring-2 focus:ring-blue-400 focus:outline-none"
                            placeholder="Дмитро" required>
                    </div>
                    
                    <div>
                        <label class="block mb-2 text-sm">Телефон</label>
                        <input type="text" id="contact-form-phone" name="phone"
                            class="w-full p-2.5 rounded-lg bg-white/10 border border-white/20 text-white placeholder-white/50 focus:ring-2 focus:ring-blue-400 focus:outline-none"
                            placeholder="+380..." required>
                    </div>

                    <div>
                        <label class="block mb-2 text-sm">Тип курсу</label>
                        <select id="contact-form-course_type" name="course_type" class="w-full p-2.5 rounded-lg bg-white/10 border border-white/20 text-white focus:ring-2 focus:ring-blue-400">
                            <option class="text-black">Теорія</option>
                            <option class="text-black">Практика</option>
                            <option class="text-black">Теорія + Практика</option>
                        </select>
                    </div>

                    <div>
                        <label class="block mb-2 text-sm">Категорія</label>
                        <select id="contact-form-course_category" name="course_category" class="w-full p-2.5 rounded-lg bg-white/10 border border-white/20 text-white focus:ring-2 focus:ring-blue-400">
                            <option class="text-black">A (мото понад 50куб)</option>
                            <option class="text-black">А1 (мото до 50куб)</option>
                            <option class="text-black">В (легкові авто)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block mb-2 text-sm text-white">
                            Повідомлення (за бажанням)
                        </label>
                        <textarea
                            id="contact-form-message" name="message"
                            rows="4"
                            placeholder="Певні запитання..."
                            class="w-full p-3 rounded-lg bg-white/10 border border-white/20 
                                text-white placeholder-white/50 text-sm
                                focus:outline-none focus:ring-2 focus:ring-blue-400
                                transition resize-none"></textarea>
                    </div>

                    <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 py-2.5 rounded-lg 
                        font-medium transition">
                        Відправити заявку
                    </button>
                </form>

            </div>
        </div>
    </div>

    <script src="./flowbite/flowbite.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="./script.js"></script>
</body>
</html>
